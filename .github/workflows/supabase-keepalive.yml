# Evita que o plano gratuito do Supabase pause o projeto por inatividade: faz uma consulta leve a cada 3 dias.
# Requer dois "Repository secrets" (Settings → Secrets and variables → Actions):
#   SUPABASE_URL  → https://SEU-PROJETO.supabase.co
#   SUPABASE_KEY  → a publishable key (a mesma do EXPO_PUBLIC_SUPABASE_KEY; é pública)
# Obs.: o GitHub desativa workflows agendados após ~60 dias sem atividade no repositório.
name: supabase-keepalive

on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve à API REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_KEY" || { echo "Defina os secrets SUPABASE_URL e SUPABASE_KEY"; exit 1; }
          curl -fsS "$SUPABASE_URL/rest/v1/establishments?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" > /dev/null
          echo "Supabase respondeu."
